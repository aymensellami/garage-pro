name: CI - Tests et Qualite

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main

jobs:

  test:
    name: Tests Symfony
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: garage_pro_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql, intl, zip, gd, mbstring, xml
          coverage: none
          tools: composer

      - name: PHP version
        run: php -v

      - name: Composer version
        run: composer --version

      - name: Validate composer
        run: composer validate --strict

      - name: Configure test environment
        run: |
          cat > .env <<'EOF'
          APP_ENV=test
          APP_SECRET=garagepro-ci-secret
          DATABASE_URL="mysql://root:root@127.0.0.1:3306/garage_pro_test?serverVersion=8.0&charset=utf8mb4"
          EOF

      - name: Install dependencies
        env:
          APP_ENV: test
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Check Symfony
        env:
          APP_ENV: test
        run: php bin/console about

      - name: Clear Symfony cache
        env:
          APP_ENV: test
        run: php bin/console cache:clear

      - name: Create test database
        env:
          APP_ENV: test
        run: php bin/console doctrine:database:create --if-not-exists

      - name: Run migrations
        env:
          APP_ENV: test
        run: php bin/console doctrine:migrations:migrate --no-interaction

      - name: Validate Doctrine mapping
        env:
          APP_ENV: test
        run: php bin/console doctrine:schema:validate

      - name: PHP syntax check
        run: |
          find src tests -name "*.php" -print0 | xargs -0 -n1 php -l

      - name: Run PHPUnit
        env:
          APP_ENV: test
        run: vendor/bin/phpunit


  code-quality:
    name: Qualite du code
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: intl, mbstring, xml, zip
          coverage: none
          tools: composer

      - name: Configure CI environment
        run: |
          cat > .env <<'EOF'
          APP_ENV=test
          APP_SECRET=garagepro-ci-secret
          DATABASE_URL="mysql://root:root@127.0.0.1:3306/garage_pro_test?serverVersion=8.0&charset=utf8mb4"
          EOF

      - name: Install dependencies
        env:
          APP_ENV: test
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: PHP syntax check
        run: |
          find src tests -name "*.php" -print0 | xargs -0 -n1 php -l

      - name: PHP CS Fixer
        run: vendor/bin/php-cs-fixer fix --dry-run --diff --config=.php-cs-fixer.dist.php

      - name: PHPStan
        run: vendor/bin/phpstan analyse src --level=6 --no-progress

      - name: Twig Lint
        env:
          APP_ENV: test
        run: php bin/console lint:twig templates

      - name: YAML Lint
        env:
          APP_ENV: test
        run: php bin/console lint:yaml config

      - name: Container Lint
        env:
          APP_ENV: test
        run: php bin/console lint:container