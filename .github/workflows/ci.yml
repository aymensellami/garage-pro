
name: CI - Tests et Qualite

on:
  workflow_dispatch:

  push:
    branches:
      - main
      - develop

jobs:

  # ============================================================
  # JOB 1 : TESTS SYMFONY
  # ============================================================
  test:
    name: Tests Symfony
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0

        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: garage_pro_test

        ports:
          - 3306:3306

        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:

      # ----------------------------------------------------------
      # 1. Récupération du projet
      # ----------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # ----------------------------------------------------------
      # 2. Installation PHP 8.2
      # ----------------------------------------------------------
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql, intl, zip, gd, mbstring, xml
          coverage: pcov
          tools: composer

      # ----------------------------------------------------------
      # 3. Vérification PHP
      # ----------------------------------------------------------
      - name: PHP version
        run: php -v

      # ----------------------------------------------------------
      # 4. Vérification Composer
      # ----------------------------------------------------------
      - name: Composer version
        run: composer --version

      # ----------------------------------------------------------
      # 5. Validation composer.json
      # ----------------------------------------------------------
      - name: Validate composer
        run: composer validate --strict

      # ----------------------------------------------------------
      # 6. Configuration environnement TEST
      # ----------------------------------------------------------
      - name: Configure test environment
        run: |
          cat > .env <<'EOF'
          APP_ENV=test
          APP_SECRET=garagepro-ci-secret
          DATABASE_URL="mysql://root:root@127.0.0.1:3306/garage_pro_test?serverVersion=8.0&charset=utf8mb4"
          MAILER_DSN="null://null"
          MESSENGER_TRANSPORT_DSN="in-memory://"
          EOF

          cp .env .env.test

      # ----------------------------------------------------------
      # 7. Installation des dépendances
      # ----------------------------------------------------------
      - name: Install dependencies
        env:
          APP_ENV: test
          APP_DEBUG: '1'
        run: |
          composer install \
            --prefer-dist \
            --no-progress \
            --no-interaction

      # ----------------------------------------------------------
      # 8. Vérification Symfony
      # ----------------------------------------------------------
      - name: Verify test environment
        env:
          APP_ENV: test
          APP_DEBUG: '1'
          APP_SECRET: garagepro-ci-secret
          DATABASE_URL: "mysql://root:root@127.0.0.1:3306/garage_pro_test?serverVersion=8.0&charset=utf8mb4"
          MAILER_DSN: "null://null"
          MESSENGER_TRANSPORT_DSN: "in-memory://"
        run: |
          echo "========================================"
          echo "Symfony test environment"
          echo "========================================"

          php bin/console about --env=test

          echo "========================================"
          echo "Login route"
          echo "========================================"

          php bin/console debug:router app_login --env=test

          echo "========================================"
          echo "Admin route"
          echo "========================================"

          php bin/console debug:router app_admin_dashboard --env=test

          echo "========================================"
          echo "Container validation"
          echo "========================================"

          php bin/console lint:container --env=test

      # ----------------------------------------------------------
      # 9. Nettoyage du cache Symfony
      # ----------------------------------------------------------
      - name: Clear Symfony cache
        env:
          APP_ENV: test
          APP_DEBUG: '1'
          APP_SECRET: garagepro-ci-secret
          DATABASE_URL: "mysql://root:root@127.0.0.1:3306/garage_pro_test?serverVersion=8.0&charset=utf8mb4"
          MAILER_DSN: "null://null"
          MESSENGER_TRANSPORT_DSN: "in-memory://"
        run: |
          php bin/console cache:clear --env=test

      # ----------------------------------------------------------
      # 10. Vérification connexion MySQL
      # ----------------------------------------------------------
      - name: Check MySQL connection
        env:
          APP_ENV: test
          APP_DEBUG: '1'
          APP_SECRET: garagepro-ci-secret
          DATABASE_URL: "mysql://root:root@127.0.0.1:3306/garage_pro_test?serverVersion=8.0&charset=utf8mb4"
        run: |
          php bin/console doctrine:query:sql \
            "SELECT 1" \
            --env=test

      # ----------------------------------------------------------
      # 11. Création de la base TEST
      # ----------------------------------------------------------
      - name: Create test database
        env:
          APP_ENV: test
          APP_DEBUG: '1'
          APP_SECRET: garagepro-ci-secret
          DATABASE_URL: "mysql://root:root@127.0.0.1:3306/garage_pro_test?serverVersion=8.0&charset=utf8mb4"
        run: |
          php bin/console doctrine:database:cr
