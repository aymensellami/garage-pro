name: CI - Tests et Qualite

on:
  workflow_dispatch:

  push:
    branches:
      - main
      - develop

jobs:

  # ============================================================
  # JOB 1 : TESTS SYMFONY
  # ============================================================
  test:
    name: Tests Symfony
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0

        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: garage_pro_test

        ports:
          - 3306:3306

        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:

      # ----------------------------------------------------------
      # 1. Récupération du projet
      # ----------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # ----------------------------------------------------------
      # 2. Installation PHP 8.2
      # ----------------------------------------------------------
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql, intl, zip, gd, mbstring, xml
          coverage: none
          tools: composer

      # ----------------------------------------------------------
      # 3. Vérification PHP
      # ----------------------------------------------------------
      - name: PHP version
        run: php -v

      # ----------------------------------------------------------
      # 4. Vérification Composer
      # ----------------------------------------------------------
      - name: Composer version
        run: composer --version

      # ----------------------------------------------------------
      # 5. Validation composer.json
      # ----------------------------------------------------------
      - name: Validate composer
        run: composer validate --strict

      # ----------------------------------------------------------
      # 6. Configuration environnement TEST
      # ----------------------------------------------------------
      - name: Configure test environment
        run: |
          cat > .env <<'EOF'
          APP_ENV=test
          APP_SECRET=garagepro-ci-secret
          DATABASE_URL="mysql://root:root@127.0.0.1:3306/garage_pro_test?serverVersion=8.0&charset=utf8mb4"
          MAILER_DSN="null://null"
          MESSENGER_TRANSPORT_DSN="in-memory://"
          EOF

          cp .env .env.test

      # ----------------------------------------------------------
      # 7. Installation des dépendances
      # ----------------------------------------------------------
      - name: Install dependencies
        env:
          APP_ENV: test
          APP_DEBUG: '1'
        run: |
          composer install \
            --prefer-dist \
            --no-progress \
            --no-interaction

      # ----------------------------------------------------------
      # 8. Vérification Symfony
      # ----------------------------------------------------------
      - name: Verify test environment
        env:
          APP_ENV: test
          APP_DEBUG: '1'
          APP_SECRET: garagepro-ci-secret
          DATABASE_URL: mysql://root:root@127.0.0.1:3306/garage_pro_test?serverVersion=8.0
          MAILER_DSN: null://null
          MESSENGER_TRANSPORT_DSN: in-memory://
        run: |
          php bin/console about --env=test

          php bin/console debug:router app_admin_dashboard

          php bin/console debug:router app_login

          php bin/console lint:container --env=test

      # ----------------------------------------------------------
      # 9. Nettoyage du cache Symfony
      # ----------------------------------------------------------
      - name: Clear Symfony cache
        env:
          APP_ENV: test
          APP_DEBUG: '1'
          APP_SECRET: garagepro-ci-secret
          DATABASE_URL: mysql://root:root@127.0.0.1:3306/garage_pro_test?serverVersion=8.0
          MAILER_DSN: null://null
          MESSENGER_TRANSPORT_DSN: in-memory://
        run: |
          php bin/console cache:clear --env=test

      # ----------------------------------------------------------
      # 10. Vérification connexion MySQL
      # ----------------------------------------------------------
      - name: Check MySQL connection
        env:
          APP_ENV: test
          DATABASE_URL: mysql://root:root@127.0.0.1:3306/garage_pro_test?serverVersion=8.0
        run: |
          php bin/console doctrine:query:sql \
            "SELECT 1" \
            --env=test

      # ----------------------------------------------------------
      # 11. Création de la base TEST
      # ----------------------------------------------------------
      - name: Create test database
        env:
          APP_ENV: test
          DATABASE_URL: mysql://root:root@127.0.0.1:3306/garage_pro_test?serverVersion=8.0
        run: |
          php bin/console doctrine:database:create \
            --if-not-exists \
            --env=test

      # ----------------------------------------------------------
      # 12. Exécution des migrations
      # ----------------------------------------------------------
      - name: Run migrations
        env:
          APP_ENV: test
          DATABASE_URL: mysql://root:root@127.0.0.1:3306/garage_pro_test?serverVersion=8.0
        run: |
          php bin/console doctrine:migrations:migrate \
            --no-interaction \
            --env=test

      # ----------------------------------------------------------
      # 13. Validation Doctrine
      # ----------------------------------------------------------
      - name: Validate Doctrine mapping
        env:
          APP_ENV: test
          DATABASE_URL: mysql://root:root@127.0.0.1:3306/garage_pro_test?serverVersion=8.0
        run: |
          php bin/console doctrine:schema:validate \
            --env=test

      # ----------------------------------------------------------
      # 14. Vérification syntaxe PHP
      # ----------------------------------------------------------
      - name: PHP syntax check
        run: |
          find src tests \
            -name "*.php" \
            -print0 | \
            xargs -0 -n1 php -l

      # ----------------------------------------------------------
      # 15. PHPUnit
      # ----------------------------------------------------------
      - name: Run PHPUnit
        env:
          APP_ENV: test
          APP_DEBUG: '1'
          APP_SECRET: garagepro-ci-secret
          DATABASE_URL: mysql://root:root@127.0.0.1:3306/garage_pro_test?serverVersion=8.0
          MAILER_DSN: null://null
          MESSENGER_TRANSPORT_DSN: in-memory://
        run: |
          php bin/console cache:clear --env=test

          vendor/bin/phpunit \
            --display-errors \
            --display-phpunit-deprecations


  # ============================================================
  # JOB 2 : QUALITE DU CODE
  # ============================================================
  code-quality:
    name: Qualite du code
    runs-on: ubuntu-latest

    steps:

      # ----------------------------------------------------------
      # 1. Récupération du projet
      # ----------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # ----------------------------------------------------------
      # 2. Installation PHP 8.2
      # ----------------------------------------------------------
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: intl, mbstring, xml, zip
          coverage: none
          tools: composer

      # ----------------------------------------------------------
      # 3. Configuration environnement CI
      # ----------------------------------------------------------
      - name: Configure CI environment
        run: |
          cat > .env <<'EOF'
          APP_ENV=test
          APP_SECRET=garagepro-ci-secret
          DATABASE_URL="mysql://root:root@127.0.0.1:3306/garage_pro_test?serverVersion=8.0&charset=utf8mb4"
          MAILER_DSN="null://null"
          MESSENGER_TRANSPORT_DSN="in-memory://"
          EOF

          cp .env .env.test

      # ----------------------------------------------------------
      # 4. Installation Composer
      # ----------------------------------------------------------
      - name: Install dependencies
        env:
          APP_ENV: test
          APP_DEBUG: '1'
        run: |
          composer install \
            --prefer-dist \
            --no-progress \
            --no-interaction

      # ----------------------------------------------------------
      # 5. Vérification syntaxe PHP
      # ----------------------------------------------------------
      - name: PHP syntax check
        run: |
          find src tests \
            -name "*.php" \
            -print0 | \
            xargs -0 -n1 php -l

      # ----------------------------------------------------------
      # 6. PHP CS Fixer
      # ----------------------------------------------------------
      - name: PHP CS Fixer
        run: |
          vendor/bin/php-cs-fixer fix \
            --dry-run \
            --diff \
            --config=.php-cs-fixer.dist.php

      # ----------------------------------------------------------
      # 7. PHPStan
      # ----------------------------------------------------------
      - name: PHPStan
        run: |
          vendor/bin/phpstan analyse src \
            --level=6 \
            --no-progress

      # ----------------------------------------------------------
      # 8. Twig Lint
      # ----------------------------------------------------------
      - name: Twig Lint
        env:
          APP_ENV: test
          APP_DEBUG: '1'
          APP_SECRET: garagepro-ci-secret
          MAILER_DSN: null://null
          MESSENGER_TRANSPORT_DSN: in-memory://
        run: |
          php bin/console lint:twig templates

      # ----------------------------------------------------------
      # 9. YAML Lint
      # ----------------------------------------------------------
      - name: YAML Lint
        env:
          APP_ENV: test
          APP_DEBUG: '1'
          APP_SECRET: garagepro-ci-secret
          MAILER_DSN: null://null
          MESSENGER_TRANSPORT_DSN: in-memory://
        run: |
          php bin/console lint:yaml config

      # ----------------------------------------------------------
      # 10. Symfony Container Lint
      # ----------------------------------------------------------
      - name: Container Lint
        env:
          APP_ENV: test
          APP_DEBUG: '1'
          APP_SECRET: garagepro-ci-secret
          MAILER_DSN: null://null
          MESSENGER_TRANSPORT_DSN: in-memory://
        run: |
          php bin/console lint:container --env=test