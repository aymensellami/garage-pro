version: '3.9'

services:
  php:
    image: ghcr.io/${GITHUB_REPOSITORY}:latest
    container_name: garagepro-php-prod
    restart: always
    env_file:
      - .env.prod
    volumes:
      - garagepro_uploads:/var/www/html/public/uploads
    networks:
      - garagepro_network
    depends_on:
      - database

  nginx:
    image: nginx:alpine
    container_name: garagepro-nginx-prod
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - garagepro_uploads:/var/www/html/public/uploads:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/nginx/ssl:/etc/nginx/ssl:ro
    networks:
      - garagepro_network
    depends_on:
      - php

  database:
    image: mysql:8.0
    container_name: garagepro-db-prod
    restart: always
    env_file:
      - .env.prod
    volumes:
      - garagepro_db_prod:/var/lib/mysql
    networks:
      - garagepro_network

  redis:
    image: redis:7-alpine
    container_name: garagepro-redis-prod
    restart: always
    networks:
      - garagepro_network

volumes:
  garagepro_db_prod:
  garagepro_uploads:

networks:
  garagepro_network:
    driver: bridge
