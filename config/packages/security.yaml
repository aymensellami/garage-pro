security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'
        App\Entity\User: 'auto'

    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false

        main:
            lazy: true
            provider: app_user_provider

            form_login:
                login_path: app_login
                check_path: app_login
                success_handler: App\Security\LoginSuccessHandler
                enable_csrf: true
                username_parameter: _username
                password_parameter: _password

            logout:
                path: app_logout
                target: app_login

            remember_me:
                secret: '%kernel.secret%'
                lifetime: 604800
                path: /
                always_remember_me: true

    access_control:
        - { path: ^/login, roles: PUBLIC_ACCESS }
        - { path: ^/register, roles: PUBLIC_ACCESS }

        - { path: ^/admin, roles: ROLE_ADMIN }

        - { path: ^/mechanic, roles: ROLE_MECHANIC }

        - { path: ^/intervention, roles: ROLE_MECHANIC }

        - { path: ^/stock, roles: [ROLE_ADMIN, ROLE_MECHANIC] }

        - { path: ^/dashboard, roles: ROLE_USER }

        - { path: ^/appointment, roles: ROLE_USER }

        - { path: ^/vehicle, roles: ROLE_USER }

        - { path: ^/invoice, roles: ROLE_USER }

        - { path: ^/alert, roles: ROLE_USER }

        - { path: ^/, roles: ROLE_USER }

    role_hierarchy:
        ROLE_ADMIN:
            - ROLE_USER
            - ROLE_MECHANIC

        ROLE_MECHANIC:
            - ROLE_USER